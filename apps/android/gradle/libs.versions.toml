[versions]
# AGP and Kotlin must match third_party/coui17/gradle/libs.versions.toml: the
# composite build loads both into one Gradle invocation.
agp = "9.3.1"
kotlin = "2.4.10"
coui = "1.2.0"
androidx-activity = "1.13.0"
androidx-lifecycle = "2.11.0"
coil = "3.6.3"
media3 = "1.11.1"
jbcrypt = "0.4"
junit = "4.13.2"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
okhttp = "5.5.0"
androidx-work = "2.11.2"

[libraries]
coui-ui = { module = "io.github.suqi8.coui.kmp:coui-ui", version.ref = "coui" }
coui-preference = { module = "io.github.suqi8.coui.kmp:coui-preference", version.ref = "coui" }
coui-icons = { module = "io.github.suqi8.coui.kmp:coui-icons", version.ref = "coui" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
coil-gif = { module = "io.coil-kt.coil3:coil-gif", version.ref = "coil" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
jbcrypt = { module = "org.mindrot:jbcrypt", version.ref = "jbcrypt" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "androidx-work" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
