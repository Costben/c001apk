name: Build

on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'third_party/coui17/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'apps/android/**'
      - 'third_party/coui17/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      release:
        description: 'Build with the official release certificate (requires Secrets)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/android

jobs:
  debug:
    name: Unit tests and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833' # 23.0; older tools cannot see API 37 packages
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - name: Name and checksum the debug APK
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          mkdir -p build/distribution
          cp app/build/outputs/apk/debug/app-debug.apk "build/distribution/c001apk-coui-$version-debug.apk"
          (cd build/distribution && sha256sum ./*.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: c001apk-coui-debug
          path: apps/android/build/distribution/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Signed release APK
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: debug
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      KEY_ALIAS: '秋风のとおり道'
      EXPECTED_CERT_SHA256: 'EA385AFC82E19824EEA8A8868ED365DF03E9886BBBA33E47E1E04B43EC65CB67'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833' # 23.0; older tools cannot see API 37 packages
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Restore and verify release keystore
        env:
          KEYSTORE: ${{ runner.temp }}/c001apk-signing/release.jks
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          REVIA_KS_PASS: ${{ secrets.REVIA_KS_PASS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64 Secret'; exit 1; }
          test -n "$REVIA_KS_PASS" || { echo 'Missing REVIA_KS_PASS Secret'; exit 1; }
          umask 077
          mkdir -p "$(dirname "$KEYSTORE")"
          printf 'KEYSTORE=%s\n' "$KEYSTORE" >> "$GITHUB_ENV"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          keytool -exportcert -keystore "$KEYSTORE" -alias "$KEY_ALIAS" \
            -storepass:env REVIA_KS_PASS -file "$RUNNER_TEMP/c001apk-signing/cert.der"
          actual=$(sha256sum "$RUNNER_TEMP/c001apk-signing/cert.der" | cut -d ' ' -f 1 | tr '[:lower:]' '[:upper:]')
          test "$actual" = "$EXPECTED_CERT_SHA256" || { echo 'Unexpected release signing certificate'; exit 1; }
      - name: Build signed APK
        env:
          REVIA_KS_PASS: ${{ secrets.REVIA_KS_PASS }}
        run: ./gradlew :app:assembleRelease
      - name: Verify signature and package
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          apk=app/build/outputs/apk/release/app-release.apk
          report=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk")
          actual=$(printf '%s\n' "$report" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:lower:]' '[:upper:]')
          test "$actual" = "$EXPECTED_CERT_SHA256" || { echo 'Unexpected APK certificate'; exit 1; }
          mkdir -p build/distribution
          cp "$apk" "build/distribution/c001apk-coui-$version.apk"
          (cd build/distribution && sha256sum ./*.apk > SHA256SUMS.txt)
      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/c001apk-signing/release.jks" "$RUNNER_TEMP/c001apk-signing/cert.der"
          rmdir "$RUNNER_TEMP/c001apk-signing" 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: c001apk-coui-release
          path: apps/android/build/distribution/*
          if-no-files-found: error
          retention-days: 14
